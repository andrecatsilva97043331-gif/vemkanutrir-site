# Deploy Firebase Hosting a cada push em main.
# Secrets necessários no GitHub (Settings → Secrets and variables → Actions):
#   - FIREBASE_SERVICE_ACCOUNT  → JSON da service account (recomendado)
#     OU
#   - FIREBASE_TOKEN            → token de CI (`firebase login:ci`) — menos preferível
# Também ajuste o projectId abaixo se o ID real no Firebase Console for outro.

name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: vemkanutrir-site
        # Se preferir token CI em vez de service account, remova firebaseServiceAccount
        # e use: env: { FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_TOKEN }} }
